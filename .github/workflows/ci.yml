name: CI Pipeline

on:
  pull_request:
    branches: [ main, master, develop ]

jobs:
  lint-and-format:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - informational only
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Update Poetry Lock File
        run: |
          poetry lock --check || poetry lock
        continue-on-error: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root
        continue-on-error: true

      - name: Run Ruff Linter
        run: poetry run ruff check . --output-format=github
        continue-on-error: true

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .
        continue-on-error: true

      - name: Run Black Format Check
        run: poetry run black --check .
        continue-on-error: true

      - name: Run isort Import Check
        run: poetry run isort --check-only .
        continue-on-error: true

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - informational only
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Update Poetry Lock File
        run: |
          poetry lock --check || poetry lock
        continue-on-error: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root
        continue-on-error: true

      - name: Run Bandit Security Checks
        run: poetry run bandit -r app -f json -o bandit-report.json || true
        continue-on-error: true

      - name: Display Bandit Results
        run: |
          if [ -f bandit-report.json ]; then
            poetry run bandit -r app -f screen
          fi

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          retention-days: 30

  type-check:
    name: Type Checking (MyPy)
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - informational only
    defaults:
      run:
        working-directory: ./backend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Update Poetry Lock File
        run: |
          poetry lock --check || poetry lock
        continue-on-error: true

      - name: Install dependencies
        run: poetry install --no-interaction --no-root
        continue-on-error: true

      - name: Run MyPy Type Checker
        run: poetry run mypy app --ignore-missing-imports --show-error-codes
        continue-on-error: true

  test:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - informational only
    defaults:
      run:
        working-directory: ./backend
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.virtualenvs
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Update Poetry Lock File
        run: |
          poetry lock --check || poetry lock
        continue-on-error: true

      - name: Install dependencies
        run: poetry install --no-interaction
        continue-on-error: true

      - name: Set up test environment variables
        run: |
          cat > .env.test << EOF
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/eshop_test
          REDIS_URL=redis://localhost:6379/0
          RABBITMQ_URL=amqp://guest:guest@localhost:5672/
          ENVIRONMENT=test
          DEBUG=false
          EOF

      - name: Run Tests with Coverage
        run: |
          poetry run pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            -v || true
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/eshop_test
          REDIS_URL: redis://localhost:6379/0
          RABBITMQ_URL: amqp://guest:guest@localhost:5672/
          ENVIRONMENT: test
        continue-on-error: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            backend/htmlcov/
            backend/coverage.xml
          retention-days: 30

      - name: Comment Coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 70
        continue-on-error: true

      - name: Coverage Badge
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: ./backend/coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking - informational only
    needs: [lint-and-format, security, type-check, test]
    if: always()
    
    steps:
      - name: Check all jobs status
        run: |
          echo "📊 CI Results Summary:"
          echo "  Lint & Format: ${{ needs.lint-and-format.result }}"
          echo "  Security: ${{ needs.security.result }}"
          echo "  Type Check: ${{ needs.type-check.result }}"
          echo "  Tests: ${{ needs.test.result }}"
          echo ""
          echo "ℹ️  All checks are informational only - not blocking merge"
        continue-on-error: true

