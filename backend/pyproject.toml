[tool.poetry]
name = "eshop-backend"
version = "0.1.0"
description = "Modular Monolith eShop migrated from .NET to Python (FastAPI)"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "app"}]
package-mode = true

[tool.poetry.group.main.dependencies]
python = ">=3.12,<4.0"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
structlog = "^24.1.0"
dependency-injector = "^4.48.1"
# Object mapping and validation
msgspec = "^0.19.0"
# Messaging
faststream = {extras = ["rabbit"], version = "^0.5.0"}
# Retry mechanism
tenacity = "^8.2.0"
# Pagination
fastapi-pagination = "^0.13.3"
# Additional dependencies
redis = "^5.0.0"
fastapi-keycloak = "^1.1.0"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
python-multipart = "^0.0.9"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.0.0"
greenlet = "^3.2.4"
httpx = "^0.27.0"
pyyaml = "^6.0.0"
# OpenTelemetry for tracing and metrics
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-instrumentation-fastapi = "^0.45b0"
# Prometheus metrics (using prometheus-client directly, no separate OTEL exporter needed)
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
respx = "^0.21.0"
faker = "^24.0.0"
types-aiofiles = "^24.1.0"
# Linting and formatting
ruff = "^0.4.0"
black = "^24.0.0"
bandit = "^1.7.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
isort = "^6.0.1"

[tool.poetry.scripts]
start = "app.main:run"
dev = "uvicorn:run"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q"]
ignore = ["E501", "B008", "C901"]

[tool.black]
target-version = ['py312']
line-length = 88

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
disable_error_code = [
    "no-untyped-def",
    "no-untyped-call",
    "no-any-return",
    "type-arg",
    "annotation-unchecked",
]

[tool.coverage.run]
source = [
    "app/core",
    "app/config",
    "app/modules",
    "app/main.py",
]
omit = [
    "*/migrations/**",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B601"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--disable-warnings",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "no_collect: marks classes that should not be collected as tests",
] 