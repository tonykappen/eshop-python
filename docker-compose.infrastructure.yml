# Infrastructure services for eShop application
# This file can be used independently for development
# or imported by the main docker-compose.yml
# Compatible with both docker-compose and podman-compose

services:
  postgres:
    image: postgres:17
    container_name: eshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eshop"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - eshop-network

  redis:
    image: redis:7.2-alpine
    container_name: eshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - eshop-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: eshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    # Fix permissions issue with .erlang.cookie in Podman
    # The entrypoint script handles user switching, we just need to fix permissions first
    entrypoint: >
      bash -c "
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq 2>/dev/null || true
        if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then
          chmod 600 /var/lib/rabbitmq/.erlang.cookie 2>/dev/null || true
        fi
        exec docker-entrypoint.sh rabbitmq-server
      "
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - eshop-network

  seq:
    image: datalust/seq:2024.3
    container_name: eshop-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "admin"
      SEQ_API_KEY: "your-seq-api-key-change-in-production"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "false"
    ports:
      - "5341:80"
      - "5342:5341"
    volumes:
      - seq_data:/data
    # Seq doesn't have curl, use a simple TCP check instead
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/80' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    networks:
      - eshop-network

  keycloak-init:
    image: postgres:17
    container_name: eshop-keycloak-init
    environment:
      PGPASSWORD: postgres
    command: >
      sh -c "
        until psql -h postgres -U postgres -d eshop -c 'SELECT 1' >/dev/null 2>&1; do
          sleep 0.5
        done &&
        psql -h postgres -U postgres -d eshop -c 'CREATE SCHEMA IF NOT EXISTS keycloak; GRANT ALL PRIVILEGES ON SCHEMA keycloak TO postgres;'
      "
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eshop-network
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: eshop-keycloak
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/eshop
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_CLIENT_SECRET: "eshop-secure-client-secret-2024"
      # JVM optimizations to reduce CPU usage at startup
      JAVA_OPTS_APPEND: >-
        -Xms512m
        -Xmx1536m
        -XX:MetaspaceSize=128m
        -XX:MaxMetaspaceSize=256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+ParallelRefProcEnabled
        -XX:+UseStringDeduplication
        -XX:+OptimizeStringConcat
        -Djava.awt.headless=true
        -Dfile.encoding=UTF-8
        -Djava.security.egd=file:/dev/./urandom
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=75.0
    ports:
      - "8080:8080"
    command: start-dev
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { java.net.URI uri = java.net.URI.create(args[0]); System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)uri.toURL().openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:8080/realms/master']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    networks:
      - eshop-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  seq_data:

networks:
  eshop-network:
    driver: bridge
