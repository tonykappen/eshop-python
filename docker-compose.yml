

services:
  postgres:
    image: postgres:15
    container_name: eshop-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eshop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eshop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: eshop-keycloak
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    command: start-dev
#    healthcheck:
#      test: ["CMD", "nc", "-z", "localhost", "8080"]
#      interval: 10s
#      timeout: 5s
#      retries: 3
#      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  backend:
    build: 
      context: ./backend
      dockerfile: ${BACKEND_DOCKERFILE:-Dockerfile}
      args:
        CACHEBUST: ${CACHEBUST:-1}
        UPDATE_DEPS: ${UPDATE_DEPS:-false}
    container_name: eshop-backend
    environment:
      # Application Settings
      APP_NAME: "eShop Modular Monolith"
      APP_VERSION: "0.1.0"
      DEBUG: "false"
      HOST: "0.0.0.0"
      PORT: "8000"
      
      # Security
      SECRET_KEY: "your-super-secret-key-change-in-production"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      
      # Database (primary)
      DATABASE_HOST: "postgres"
      DATABASE_PORT: "5432"
      DATABASE_NAME: "eshop"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgres"
      # Database (legacy compatibility)
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "eshop"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      
      # Redis
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      
      # RabbitMQ
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: "guest"
      RABBITMQ_PASSWORD: "guest"
      RABBITMQ_VHOST: "/"
      
      # Keycloak
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_REALM: "eshop"
      KEYCLOAK_CLIENT_ID: "eshop-api"
      KEYCLOAK_CLIENT_SECRET: "your-client-secret"
      KEYCLOAK_CALLBACK_URI: "http://localhost:8000/auth/callback"
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      
      # Logging
      LOG_LEVEL: "INFO"
      SEQ_URL: "http://localhost:5341"
      LOG_ENABLE_CONSOLE: "true"
      LOG_ENABLE_SEQ: "false"
      LOG_ENABLE_FILE: "true"
      LOG_DIRECTORY: "logs"
      LOG_SEPARATE_SERVER_LOGS: "true"
      LOG_ENABLE_REQUEST_LOGGING: "true"
      LOG_REQUEST_BODY: "false"
      LOG_RESPONSE_BODY: "false"
      
      # CORS
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8001"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
#      keycloak:
#        condition: service_healthy
    volumes:
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eshop-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: