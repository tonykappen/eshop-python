<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eShop - Debug</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { padding: 10px; margin: 10px 0; border-radius: 4px; }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 4px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>eShop Authentication Debug</h1>
    
    <div id="results"></div>
    
    <button onclick="testKeycloakRealm()">Test Keycloak Realm</button>
    <button onclick="testKeycloakAuth()">Test Authentication</button>
    <button onclick="testBackendHealth()">Test Backend Health</button>
    <button onclick="testNetworkConnectivity()">Test Network</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            results.innerHTML = '';
        }
        
        async function testKeycloakRealm() {
            addResult('Testing Keycloak realm access...', 'info');
            
            try {
                addResult('Trying localhost:8080...', 'info');
                const response = await fetch('http://localhost:8080/realms/eshop');
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Keycloak realm accessible: ${data.realm}`, 'success');
                    addResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                } else {
                    addResult(`❌ Keycloak realm error: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Keycloak realm failed: ${error.message}`, 'error');
                addResult(`Error type: ${error.constructor.name}`, 'error');
                console.error('Keycloak realm test error:', error);
                
                // Try alternative URLs
                addResult('Trying alternative URLs...', 'info');
                
                const alternatives = [
                    'http://127.0.0.1:8080/realms/eshop',
                    'http://host.docker.internal:8080/realms/eshop',
                    'http://192.168.1.1:8080/realms/eshop'
                ];
                
                for (const url of alternatives) {
                    try {
                        addResult(`Trying ${url}...`, 'info');
                        const altResponse = await fetch(url);
                        if (altResponse.ok) {
                            const altData = await altResponse.json();
                            addResult(`✅ Alternative URL works: ${url}`, 'success');
                            addResult(`Realm: ${altData.realm}`, 'success');
                            return;
                        }
                    } catch (altError) {
                        addResult(`❌ ${url} failed: ${altError.message}`, 'error');
                    }
                }
            }
        }
        
        async function testKeycloakAuth() {
            addResult('Testing Keycloak authentication via backend proxy...', 'info');
            
            try {
                // Test direct Keycloak connection first
                addResult('Testing direct Keycloak connection...', 'info');
                try {
                    const directResponse = await fetch('http://localhost:8080/realms/eshop/protocol/openid-connect/token', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                        },
                        mode: 'cors',
                        body: new URLSearchParams({
                            username: 'user',
                            password: 'password',
                            grant_type: 'password',
                            client_id: 'eshop-api',
                            client_secret: 'your-client-secret'
                        })
                    });
                    
                    if (directResponse.ok) {
                        addResult('✅ Direct Keycloak connection works!', 'success');
                    } else {
                        addResult('❌ Direct Keycloak connection failed', 'error');
                    }
                } catch (directError) {
                    addResult(`❌ Direct Keycloak failed: ${directError.message}`, 'error');
                }
                
                // Test backend proxy
                addResult('Testing backend proxy authentication...', 'info');
                const response = await fetch('http://localhost:8000/api/v1/auth-proxy/token', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        username: 'user',
                        password: 'password',
                        grant_type: 'password',
                        client_id: 'eshop-api',
                        client_secret: 'your-client-secret'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('✅ Backend proxy authentication successful!', 'success');
                    addResult(`Token received (first 50 chars): ${data.access_token.substring(0, 50)}...`, 'info');
                    
                    // Decode JWT to show user info
                    try {
                        const payload = JSON.parse(atob(data.access_token.split('.')[1]));
                        addResult(`User: ${payload.preferred_username}, Roles: ${payload.realm_access.roles.join(', ')}`, 'info');
                    } catch (e) {
                        addResult('Could not decode JWT payload', 'error');
                    }
                } else {
                    const errorData = await response.json();
                    addResult(`❌ Backend proxy authentication failed: ${response.status} ${response.statusText}`, 'error');
                    addResult(`<pre>${JSON.stringify(errorData, null, 2)}</pre>`, 'error');
                }
            } catch (error) {
                addResult(`❌ Authentication failed: ${error.message}`, 'error');
                addResult(`Error details: ${error.toString()}`, 'error');
                console.error('Authentication test error:', error);
            }
        }
        
        async function testBackendHealth() {
            addResult('Testing backend health...', 'info');
            
            try {
                const response = await fetch('http://localhost:8000/health');
                const data = await response.json();
                
                if (response.ok) {
                    addResult(`✅ Backend healthy: ${data.status}`, 'success');
                    addResult(`<pre>${JSON.stringify(data, null, 2)}</pre>`, 'info');
                } else {
                    addResult(`❌ Backend error: ${response.status} ${response.statusText}`, 'error');
                }
            } catch (error) {
                addResult(`❌ Backend failed: ${error.message}`, 'error');
                console.error('Backend test error:', error);
            }
        }
        
        async function testNetworkConnectivity() {
            addResult('Testing network connectivity...', 'info');
            
            const testUrls = [
                { name: 'Backend API', url: 'http://localhost:8000/health' },
                { name: 'Keycloak (localhost)', url: 'http://localhost:8080' },
                { name: 'Keycloak (127.0.0.1)', url: 'http://127.0.0.1:8080' },
                { name: 'Google DNS', url: 'https://8.8.8.8' },
                { name: 'Internet (httpbin)', url: 'https://httpbin.org/get' }
            ];
            
            for (const test of testUrls) {
                try {
                    addResult(`Testing ${test.name}...`, 'info');
                    const startTime = Date.now();
                    const response = await fetch(test.url, { 
                        method: 'GET',
                        mode: 'cors',
                        signal: AbortSignal.timeout(5000) // 5 second timeout
                    });
                    const endTime = Date.now();
                    const duration = endTime - startTime;
                    
                    if (response.ok) {
                        addResult(`✅ ${test.name}: OK (${duration}ms, status: ${response.status})`, 'success');
                    } else {
                        addResult(`⚠️ ${test.name}: HTTP ${response.status} (${duration}ms)`, 'error');
                    }
                } catch (error) {
                    addResult(`❌ ${test.name}: ${error.message}`, 'error');
                }
            }
        }
        
        // Auto-run tests on page load
        window.addEventListener('load', () => {
            addResult('Debug page loaded. Running automatic tests...', 'info');
            setTimeout(testNetworkConnectivity, 500);
            setTimeout(testKeycloakRealm, 1000);
            setTimeout(testBackendHealth, 1500);
        });
    </script>
</body>
</html>
