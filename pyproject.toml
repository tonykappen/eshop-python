[tool.poetry]
name = "eshop"
version = "0.1.0"
description = "Modular Monolith eShop migrated from .NET to Python (FastAPI)"
authors = ["Your Name <your.email@example.com>"]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}
sqlalchemy = "^2.0.0"
alembic = "^1.13.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
structlog = "^24.1.0"
dependency-injector = "^4.48.1"
dataclass-mapper = {version = "^1.9.3", extras = ["pydantic"]}
passlib = "^1.7.4"
# Additional dependencies for client requirements
redis = "^5.0.0"
pika = "^1.3.0"
python-keycloak = "^3.7.0"
# pymapper = "^0.1.0"  # Not available in PyPI, using dataclass-mapper instead
# mediatr = "^0.1.0"   # Not available in PyPI, will implement custom
# seqlog = "^0.8.0"    # Not available in PyPI, using structlog instead
psycopg2-binary = "^2.9.0"
python-multipart = "^0.0.6"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
bcrypt = "^4.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
bandit = "^1.7.0"
ruff = "^0.4.0"
black = "^24.0.0"
pre-commit = "^3.6.0"
mypy = "^1.8.0"

[tool.poetry.scripts]
start = "eshop.main:run"
dev = "uvicorn eshop.main:app --reload --host 0.0.0.0 --port 8000"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q"]
ignore = ["E501", "B008", "C901"]

[tool.black]
target-version = ['py311']
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true 